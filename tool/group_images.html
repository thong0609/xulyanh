<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt nhóm ảnh theo URL</title>
<style>
:root{font-family:system-ui,sans-serif;color:#183037;background:#f2f6f5}*{box-sizing:border-box}body{margin:0}main{max-width:1450px;margin:auto;padding:28px 24px 40px}h1{margin:0 0 8px;font-size:29px}p{color:#526a70;line-height:1.6}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.stat{border:1px solid #d7e3df;border-radius:10px;background:white;padding:14px 20px;min-width:150px}.stat b{display:block;font-size:27px}.toolbar,.actions,.pager{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}input,select,button{font:inherit;padding:10px;border:1px solid #c4d4ce;border-radius:7px;background:white}input[type=search]{width:min(420px,100%)}button{cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:wait}.primary{background:#126d54;color:white;border-color:#126d54}.danger{color:#ae3f23;border-color:#d99884}.group{background:white;border:1px solid #d7e3df;border-radius:12px;padding:18px;margin:20px 0}.group.chosen{border-color:#178b67}.grouphead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grouphead h2{font-size:18px;margin:0}.badge{font-size:12px;border-radius:20px;padding:5px 9px;background:#eaf0ee}.yes{background:#dcefe3;color:#136541}.no{background:#ffe6de;color:#a83c27}.body{display:grid;grid-template-columns:minmax(240px,34%) 1fr;gap:22px;margin-top:16px}.image{position:sticky;top:14px;align-self:start}.image img{width:100%;height:330px;object-fit:contain;background:#f6f8f7;border-radius:8px;cursor:zoom-in}.url{overflow-wrap:anywhere;font-size:12px;margin-top:10px}a{color:#176a83}table{width:100%;border-collapse:collapse}td{border-top:1px solid #e4ece8;padding:13px 10px;vertical-align:top}tr.keep{background:#e6f5ed}input[type=checkbox]{width:18px;height:18px;cursor:pointer}.name{font-weight:650;font-size:16px}.meta{font-size:12px;color:#627c80;margin-top:6px}details{margin-top:8px;font-size:13px}details p{white-space:pre-wrap}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #c4d4ce;padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 -2px 12px #0001;z-index:2}#message{white-space:pre-wrap;overflow-wrap:anywhere;min-height:25px;color:#17664f}.error{color:#b4341a!important}.pager{justify-content:space-between}dialog{max-width:95vw;max-height:95vh;border:0;border-radius:12px}dialog img{display:block;max-width:86vw;max-height:80vh}#empty{text-align:center;padding:40px}@media(max-width:780px){main{padding:20px 12px 40px}.body{grid-template-columns:1fr}.image{position:static}.image img{height:260px}.footer{padding:10px 12px}.stat{flex:1;min-width:125px}}
</style>
<main><h1>Duyệt nhóm ảnh theo URL</h1><p id="file">Đang đọc CSV chính…</p><p>Mỗi nhóm dùng cùng <b>image_url</b>. Chọn một hoặc nhiều record: các record được chọn sẽ yes, những record còn lại cùng nhóm sẽ no khi áp dụng. Nhãn approve hiện tại hiển thị cạnh từng record.</p>
<div id="stats" class="stats"></div><div class="actions"><strong id="planned">Chưa chọn nhóm để gán nhãn</strong><button id="export" class="primary">Xuất CSV đã gán nhãn</button></div>
<div class="toolbar"><input id="search" type="search" placeholder="Tìm entity, danh mục hoặc URL ảnh…" aria-label="Tìm kiếm"><select id="kind"><option value="duplicates">Chỉ ảnh trùng</option><option value="unique">Chỉ ảnh riêng biệt</option><option value="all">Tất cả ảnh</option></select><select id="review"><option value="all">Mọi nhóm</option><option value="pending">Chưa duyệt · còn nhãn trống</option><option value="reviewed">Đã duyệt · tất cả có yes/no</option></select><select id="label"><option value="all">Mọi nhãn approve</option><option value="yes">Có yes</option><option value="no">Có no</option><option value="blank">Có nhãn trống</option></select><select id="sort" aria-label="Sắp xếp số record trong nhóm"><option value="most">Nhiều record trước</option><option value="fewest">Ít record trước</option></select><select id="size"><option value="10">10 nhóm / trang</option><option value="5">5 nhóm / trang</option><option value="25">25 nhóm / trang</option></select></div>
<div class="actions"><button id="auto">Đề xuất 1 yes mỗi nhóm chưa chọn · ưu tiên nhãn yes hiện có</button><button id="reset">Bỏ toàn bộ lựa chọn</button></div>
<p id="message" role="status"></p><p id="count"></p><section id="groups"></section><p id="empty" hidden>Không có nhóm phù hợp.</p><div class="pager"><button id="prev">← Trang trước</button><span id="page"></span><button id="next">Trang sau →</button></div></main>

<dialog id="zoom"><button id="close">Đóng</button><img id="large" alt="Ảnh phóng to"></dialog>
<script>
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
let page=1,pages=1,busy=false,timer,request=0;
const groupSearch=new Map();
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();
const fmt=x=>Number(x).toLocaleString('vi-VN');
function message(t,error=false){$('message').textContent=t;$('message').className=error?'error':''}
function safeURL(t){try{const u=new URL(t);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function link(text,url){const a=el('a',text),u=safeURL(url);if(u){a.href=u;a.target='_blank';a.rel='noopener noreferrer'}return a}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'Lỗi server');return v}
function controls(){document.querySelectorAll('main input,main select,main button,.footer button').forEach(n=>n.disabled=busy||n.dataset.requiresChoice==='1');$('prev').disabled=busy||page<=1;$('next').disabled=busy||page>=pages}
function stats(s){$('file').textContent=s.file+' · Lựa chọn được lưu để mở lại phiên sau';$('stats').replaceChildren();for(const [v,t] of [[s.rows,'record trong CSV'],[s.unique_urls,'URL ảnh riêng biệt'],[s.duplicate_groups,'nhóm ảnh trùng'],[s.excess_records,'record cùng URL ngoài dòng đại diện']]){const d=el('div',undefined,'stat');d.append(el('b',fmt(v)),el('span',t));$('stats').append(d)}$('planned').textContent='Sẽ gán '+fmt(s.planned_yes)+' yes · '+fmt(s.planned_no)+' no · Giữ đủ '+fmt(s.rows)+' dòng';if(s.warning)message(s.warning,true)}
async function choose(gid,indices){await action('/api/select',{group:gid,keep_indices:indices},'Đã lưu lựa chọn. Bấm Áp dụng nhóm này để ghi yes/no cho riêng nhóm.');}
function group(g){const selected=new Set(g.keep_indices||(g.keep_index===null?[]:[g.keep_index]));function toggle(index){const next=new Set(selected);if(next.has(index))next.delete(index);else next.add(index);choose(g.id,[...next]);}const box=el('article',undefined,'group'+(g.reviewed?' chosen':'')),head=el('div',undefined,'grouphead');head.append(el('h2',g.rows[0].entity_name),el('span',g.rows.length+' record','badge'),el('span',g.reviewed?'Đã duyệt trong CSV':'Chưa duyệt trong CSV','badge'));if(g.has_selection)head.append(el('span',selected.size===0?(g.rows.every(r=>r.approve==='no')?'Đã gán tất cả no':'Bỏ qua, không đổi nhãn'):'Lựa chọn: '+selected.size+' record yes','badge'));const all=el('button','Không đổi nhãn nhóm');all.onclick=()=>choose(g.id,null);const apply=el('button','Áp dụng nhóm này','primary');apply.dataset.requiresChoice=selected.size===0?'1':'0';apply.disabled=selected.size===0;apply.onclick=()=>action('/api/apply-group',{group:g.id},'Đã lưu yes/no riêng nhóm này. Các nhóm khác không đổi.');const rejectAll=el('button','Tất cả no','danger');rejectAll.onclick=()=>action('/api/all-no',{group:g.id},'Đã gán no cho toàn bộ record trong nhóm này.');const approveAll=el('button','Tất cả yes','primary');approveAll.onclick=()=>action('/api/all-yes',{group:g.id},'Đã gán yes cho toàn bộ record trong nhóm này.');head.append(all,apply,rejectAll,approveAll);box.append(head);
 const body=el('div',undefined,'body'),visual=el('div',undefined,'image'),url=safeURL(g.url);if(url){const img=el('img');img.src=url;img.alt=g.rows[0].entity_name;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{img.hidden=true;visual.prepend(el('p','Không tải được ảnh. Thử mở URL gốc.'))};img.onclick=()=>{$('large').src=url;$('zoom').showModal()};visual.append(img)}visual.append(link('Mở ảnh gốc ↗',g.url),el('div',g.url,'url'));const table=el('table'),entries=[];
 for(const r of g.rows){const tr=el('tr',undefined,selected.has(r._index)?'keep':''),select=el('td'),radio=el('input');radio.type='checkbox';radio.name=g.id;radio.checked=selected.has(r._index);radio.setAttribute('aria-label','Chọn yes cho '+r.entity_name);radio.onchange=()=>toggle(r._index);select.append(radio);const td=el('td'),title=el('label',r.entity_name,'name');title.onclick=()=>toggle(r._index);td.append(title,el('div','Dòng dữ liệu '+(r._index+1)+' · '+(r.leaf_label||''),'meta'));td.append(el('span',r.approve||'trống','badge '+r.approve));if(selected.size>0){td.append(el('span',' → Sau áp dụng: '+(selected.has(r._index)?'yes':'no'),'badge '+(selected.has(r._index)?'yes':'no')))}const source=el('div',undefined,'meta');source.append(link(r.page_title||'Mở bài nguồn ↗',r.page_url));td.append(source);if(r.mo_ta){const d=el('details');d.append(el('summary','Xem mô tả'),el('p',r.mo_ta));td.append(d)}tr.append(select,td);table.append(tr);entries.push({tr,name:norm(r.entity_name),index:r._index})}
 const list=el('div'),bar=el('div',undefined,'toolbar'),search=el('input'),clear=el('button','Xóa tìm kiếm'),count=el('p',undefined,'meta'),empty=el('p','Không có entity khớp tên trong nhóm này.','meta');
 search.type='search';search.placeholder='Tìm tên entity trong nhóm này…';search.setAttribute('aria-label','Tìm tên entity trong nhóm '+g.rows[0].entity_name);search.value=groupSearch.get(g.id)||'';count.setAttribute('aria-live','polite');
 function filter(){const q=norm(search.value);let visible=0,selectedHidden=false;for(const item of entries){item.tr.hidden=!!q&&!item.name.includes(q);if(!item.tr.hidden)visible++;else if(selected.has(item.index))selectedHidden=true}count.textContent='Hiển thị '+visible+' / '+entries.length+' record trong nhóm.'+(selectedHidden?' Record đã chọn yes đang bị ẩn bởi bộ lọc.':'');empty.hidden=visible>0;clear.disabled=busy||!search.value;}
 search.oninput=()=>{groupSearch.set(g.id,search.value);filter()};clear.onclick=()=>{search.value='';groupSearch.delete(g.id);filter();search.focus()};bar.append(search,clear);list.append(bar,count,table,empty,el('p','Bộ lọc chỉ ẩn dòng trên màn hình. Khi áp dụng, các record được chọn sẽ yes và các record còn lại của toàn nhóm sẽ no.','meta'));filter();body.append(visual,list);box.append(body);return box}

async function load(){const id=++request;const query=new URLSearchParams({q:$('search').value,kind:$('kind').value,review:$('review').value,label:$('label').value,sort:$('sort').value,size:$('size').value,page});const data=await api('/api/groups?'+query);if(id!==request)return;page=data.page;pages=data.pages;stats(data.stats);$('groups').replaceChildren(...data.groups.map(group));$('count').textContent=fmt(data.matched)+' nhóm phù hợp';$('page').textContent=page+' / '+pages;$('empty').hidden=!!data.groups.length;controls()}
async function action(path,data,success){if(busy)return;clearTimeout(timer);busy=true;controls();try{const result=await api(path,data);await load();message(success+(result.export?'\nFile: '+result.export:'')+(result.backup?'\nSao lưu: '+result.backup:''));}catch(e){message(e.message,true)}finally{busy=false;controls()}}
for(const id of ['kind','review','label','size','sort'])$(id).onchange=()=>{page=1;load().catch(e=>message(e.message,true))};$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load().catch(e=>message(e.message,true))},350)};
$('prev').onclick=()=>{page--;load().catch(e=>message(e.message,true));window.scrollTo(0,0)};$('next').onclick=()=>{page++;load().catch(e=>message(e.message,true));window.scrollTo(0,0)};
$('auto').onclick=()=>action('/api/auto',{},'Đã đề xuất: mỗi nhóm một yes, các dòng khác no. Kiểm tra lựa chọn rồi áp dụng.');$('reset').onclick=()=>action('/api/reset',{},'Đã bỏ toàn bộ lựa chọn.');$('export').onclick=()=>action('/api/export',{},'Đã xuất CSV có nhãn yes/no, giữ nguyên tất cả record.');$('close').onclick=()=>$('zoom').close();
if(location.protocol==='file:')message('Mở bằng server: /usr/bin/python3 tool/group_images_server.py — rồi vào http://127.0.0.1:8010',true);else load().catch(e=>message(e.message,true));
</script></html>
